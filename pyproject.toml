[project]
name = "fullstack-template"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "authx>=1.6.0",
    "fastapi>=0.136.1",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "jinja2>=3.1.0",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.8.0",
    "python-multipart>=0.0.20",
    "rich>=13.0.0",
    "ruff>=0.15.13",
    "sqlalchemy>=2.0.49",
    "typer>=0.25.1",
    "uvicorn>=0.47.0",
]

[project.scripts]
ft = "cli.main:app"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/backend"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]
