services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    restart: always
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DB_HOST: db
      TICKET_ATTACHMENT_DIR: /app/var/ticket-attachments
      BILLING_DEMO_PAYMENTS_ENABLED: ${BILLING_DEMO_PAYMENTS_ENABLED:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      MEDIAMTX_HLS_INTERNAL_URL: http://mediamtx:8888
    volumes:
      - ticket_attachments:/app/var/ticket-attachments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    restart: unless-stopped
    volumes:
      - ./infra/mediamtx.docker.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:9997:9997"
      - "127.0.0.1:9998:9998"
      - "${MEDIAMTX_BIND_HOST:-127.0.0.1}:8889:8889"
      - "${MEDIAMTX_BIND_HOST:-127.0.0.1}:8189:8189/udp"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    restart: always
    build:
      context: src/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pg_data:
  ticket_attachments:
